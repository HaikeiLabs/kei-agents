[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kei-agents"
version = "0.1.0"
description = "Agent definitions, tools, and prompts for the Kei AI platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kei Team", email = "team@kei.ai"}
]
keywords = ["ai", "agents", "llm", "pydantic-ai", "tool-definitions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/HaikeiLabs/kei-agents"
Repository = "https://github.com/HaikeiLabs/kei-agents"
Issues = "https://github.com/HaikeiLabs/kei-agents/issues"

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
